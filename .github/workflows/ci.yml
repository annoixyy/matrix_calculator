name: Matrix Calculator CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libgtest-dev doxygen graphviz valgrind

      - name: Configure project
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build project
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --verbose --output-on-failure

      - name: Check memory
        run: valgrind --leak-check=full --error-exitcode=1 ./build/tests/matrix_tests

      - name: Generate documentation
        run: doxygen Doxyfile
